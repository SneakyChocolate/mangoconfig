# ------------------------------------------------------------
# MOVE mode — move the focused window within the layout
# (previously SUPER+CTRL+h/l/j/k)
# NONE + h/l/j/k      -> move_client   (dwindle re-inserts, others swap)
# SHIFT + h/l/j/k     -> exchange_client (always swap)
# NONE + b            -> dwindle: toggle current window's split (re-align now)
# NONE + [ / ]        -> dwindle: set next-split direction vertical / horizontal
keymode=move
binds=NONE,h,move_client,left
binds=NONE,l,move_client,right
binds=NONE,k,move_client,up
binds=NONE,j,move_client,down
bind=NONE,Left,move_client,left
bind=NONE,Right,move_client,right
bind=NONE,Up,move_client,up
bind=NONE,Down,move_client,down
binds=SHIFT,h,exchange_client,left
binds=SHIFT,l,exchange_client,right
binds=SHIFT,k,exchange_client,up
binds=SHIFT,j,exchange_client,down
bind=SHIFT,Left,exchange_client,left
bind=SHIFT,Right,exchange_client,right
bind=SHIFT,Up,exchange_client,up
bind=SHIFT,Down,exchange_client,down
binds=NONE,b,dwindle_toggle_current_split
binds=NONE,bracketleft,dwindle_split_vertical
binds=NONE,bracketright,dwindle_split_horizontal
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

