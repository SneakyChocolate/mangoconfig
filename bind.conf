# ============================================================
#  Mango keybindings — modal design
#
#  Mod (SUPER) is the trigger key. Modes are entered with
#  SUPER + <mode key>, then single keys perform the action:
#
#      SUPER+m  -> move mode    (NONE+ h/l/j/k  move window in layout)
#      SUPER+r  -> resize mode  (NONE+ h/l/j/k  resize window)
#      SUPER+w  -> monitor mode (NONE+ h/l/j/k  move focus / window)
#      SUPER+t  -> tag mode     (hint letter then a number, see below)
#
#  In every mode, Escape returns to the default mode.
#  keymode=common binds work in ALL modes.
# ============================================================

source=./bind_common.conf

source=./bind_default.conf

source=./bind_move.conf

source=./bind_resize.conf

source=./bind_monitor.conf

source=./bind_tag.conf

# back to default so following config sections are not grouped
keymode=default
