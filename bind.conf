# ============================================================
#  Mango keybindings — modal design
#
#  Mod (SUPER) is the trigger key. Modes are entered with
#  SUPER + <mode key>, then single keys perform the action:
#
#      SUPER+m  -> move mode    (NONE+ h/l/j/k  move window in layout)
#      SUPER+r  -> resize mode  (NONE+ h/l/j/k  resize window)
#      SUPER+w  -> monitor mode (NONE+ h/l/j/k  move focus / window)
#      SUPER+t  -> tag mode     (hint letter then a number, see below)
#
#  In every mode, Escape returns to the default mode.
#  keymode=common binds work in ALL modes.
# ============================================================

# ------------------------------------------------------------
# COMMON mode — available in every keymode
keymode=common

# ---- reload / quit (niri: Mod+Shift+E, Ctrl+Alt+Delete) ----
bind=SUPER+SHIFT,r,reload_config
bind=SUPER+SHIFT,e,quit
bind=CTRL+ALT,Delete,quit

# ---- launcher / terminal / apps ----
bind=SUPER+SHIFT,t,spawn,ghostty
bind=SUPER,d,spawn,fuzzel
bind=Super,Return,spawn,google-chrome
bind=CTRL+SUPER,Return,spawn,foot -e yazi
bind=Alt,Return,spawn,foot

# ---- close window (niri: Mod+Q) ----
bind=SUPER,q,killclient,

# ---- focus — always available (niri: Mod+H/L/J/K) ----
bind=SUPER,h,focusdir,left
bind=SUPER,l,focusdir,right
bind=SUPER,k,focusdir,up
bind=SUPER,j,focusdir,down
bind=SUPER,Tab,focusstack,next
bind=SUPER,u,focuslast

# ---- window state ----
bind=SUPER,o,toggleoverview,0
bind=SUPER,g,toggleglobal,
bind=SUPER,v,togglefloating,
bind=SUPER,f,togglemaximizescreen,
bind=SUPER+SHIFT,f,togglefullscreen,
bind=SUPER+CTRL,f,togglefakefullscreen,
bind=SUPER,i,minimized,
bind=SUPER+SHIFT,I,restore_minimized
bind=SUPER+ALT,l,spawn,swaylock -f -c 000000

# ---- volume / brightness / media (mirrors niri) ----
bind=none,XF86AudioRaiseVolume,spawn,~/.config/mango/scripts/volume.sh up
bind=none,XF86AudioLowerVolume,spawn,~/.config/mango/scripts/volume.sh down
bind=none,XF86AudioMute,spawn,~/.config/mango/scripts/volume.sh mute
bind=none,XF86AudioMicMute,spawn,~/.config/mango/scripts/volume.sh micmute
bind=none,XF86MonBrightnessUp,spawn,~/.config/mango/scripts/brightness.sh up
bind=none,XF86MonBrightnessDown,spawn,~/.config/mango/scripts/brightness.sh down
bind=none,XF86AudioPlay,spawn,playerctl play-pause
bind=none,XF86AudioStop,spawn,playerctl stop
bind=none,XF86AudioPrev,spawn,playerctl previous
bind=none,XF86AudioNext,spawn,playerctl next

# ---- screenshots ----
bind=none,Print,spawn_shell,mkdir -p ~/Pictures/Screenshots && f=~/Pictures/Screenshots/$(date +%s).png && grim "$f" && wl-copy < "$f"
bind=CTRL+ALT,a,spawn_shell,f=$(mktemp --suffix=.png) && grim -g "$(slurp -b '#2E2A1E55' -c '#fb751bff')" "$f" && wl-copy < "$f" && mkdir -p ~/Pictures/Screenshots && mv "$f" ~/Pictures/Screenshots/

# ---- custom app binds ----
bind=SUPER,p,spawn,bash ~/.config/mango/scripts/monitor.sh
bind=SUPER+SHIFT,p,spawn,bash ~/.config/mango/scripts/virmon.sh
bind=SUPER,b,spawn,bash ~/.config/mango/scripts/hide_waybar_mango.sh
bind=CTRL+ALT,backslash,spawn,swaync-client -t
bind=CTRL+ALT,BackSpace,spawn,swaync-client -C

# ---- mouse / axis / gesture (always active) ----
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=alt,btn_middle,set_proportion,0.5
mousebind=SUPER,btn_right,moveresize,curresize
mousebind=SUPER+CTRL,btn_left,minimized
mousebind=SUPER+CTRL,btn_right,killclient
mousebind=SUPER+CTRL,btn_middle,togglefullscreen
mousebind=NONE,btn_middle,togglemaximizescreen,0
axisbind=SUPER,UP,viewtoleft_have_client
axisbind=SUPER,DOWN,viewtoright_have_client
axisbind=alt,UP,focusdir,left
axisbind=alt,DOWN,focusdir,right
axisbind=shift+super,UP,exchange_client,left
axisbind=shift+super,DOWN,exchange_client,right
gesturebind=none,left,3,focusdir,left
gesturebind=none,right,3,focusdir,right
gesturebind=none,up,3,focusdir,up
gesturebind=none,down,3,focusdir,down
gesturebind=none,left,4,viewtoleft_have_client
gesturebind=none,right,4,viewtoright_have_client
gesturebind=none,up,4,toggleoverview,1
gesturebind=none,down,4,toggleoverview,1

# ------------------------------------------------------------
# DEFAULT mode — mango-specific stuff and the modal entry points
keymode=default

# ---- modal entry points (SUPER + mode key, keysym matched) ----
binds=SUPER,m,setkeymode,move
binds=SUPER,r,setkeymode,resize
binds=SUPER,w,setkeymode,monitor
binds=SUPER,t,setkeymode,tag

# ---- TAGS (mango-specific, official repo binds) ----
# switch tag
bind=SUPER,Left,viewtoleft,0
bind=SUPER,Right,viewtoright,0
# move window to adjacent tag
bind=CTRL+SUPER,Left,tagtoleft,0
bind=CTRL+SUPER,Right,tagtoright,0
# switch tag, carrying the focused window
bind=CTRL,Left,viewtoleft_have_client,0
bind=CTRL,Right,viewtoright_have_client,0
# jump to tag
bind=Ctrl,1,view,1,0
bind=Ctrl,2,view,2,0
bind=Ctrl,3,view,3,0
bind=Ctrl,4,view,4,0
bind=Ctrl,5,view,5,0
bind=Ctrl,6,view,6,0
bind=Ctrl,7,view,7,0
bind=Ctrl,8,view,8,0
bind=Ctrl,9,view,9,0
# send window to tag
bind=Alt,1,tag,1,0
bind=Alt,2,tag,2,0
bind=Alt,3,tag,3,0
bind=Alt,4,tag,4,0
bind=Alt,5,tag,5,0
bind=Alt,6,tag,6,0
bind=Alt,7,tag,7,0
bind=Alt,8,tag,8,0
bind=Alt,9,tag,9,0
# toggle window on tag
bind=ctrl+Super,1,toggletag,1
bind=ctrl+Super,2,toggletag,2
bind=ctrl+Super,3,toggletag,3
bind=ctrl+Super,4,toggletag,4
bind=ctrl+Super,5,toggletag,5
bind=ctrl+Super,6,toggletag,6
bind=ctrl+Super,7,toggletag,7
bind=ctrl+Super,8,toggletag,8
bind=ctrl+Super,9,toggletag,9
# toggle tag on view
bind=Super,1,toggleview,1
bind=Super,2,toggleview,2
bind=Super,3,toggleview,3
bind=Super,4,toggleview,4
bind=Super,5,toggleview,5
bind=Super,6,toggleview,6
bind=Super,7,toggleview,7
bind=Super,8,toggleview,8
bind=Super,9,toggleview,9

# ---- scratchpad (official) ----
bind=ALT,z,toggle_scratchpad

# ---- layout (official) ----
bind=ALT,s,zoom,
bind=ALT,e,set_proportion,1.0
bind=ALT,x,switch_proportion_preset,
bind=ALT+SUPER+CTRL,h,scroller_stack,left
bind=ALT+SUPER+CTRL,l,scroller_stack,right
bind=ALT+SUPER+CTRL,k,scroller_stack,up
bind=ALT+SUPER+CTRL,j,scroller_stack,down
bind=ALT+SHIFT,Return,dwindle_toggle_split_direction
bind=CTRL+SUPER,i,setlayout,tile
bind=CTRL+SUPER,l,setlayout,scroller
bind=SUPER,n,switch_layout

# ---- free move floating windows (official) ----
bind=CTRL+SHIFT,k,movewin,+0,-50
bind=CTRL+SHIFT,j,movewin,+0,+50
bind=CTRL+SHIFT,h,movewin,-50,+0
bind=CTRL+SHIFT,l,movewin,+50,+0

# ---- gaps (official) ----
bind=ALT+SHIFT,X,incgaps,1
bind=ALT+SHIFT,Z,incgaps,-1
bind=ALT+SHIFT,R,togglegaps

# ------------------------------------------------------------
# MOVE mode — move the focused window within the layout
# (previously SUPER+CTRL+h/l/j/k)
keymode=move
binds=NONE,h,exchange_client,left
binds=NONE,l,exchange_client,right
binds=NONE,k,exchange_client,up
binds=NONE,j,exchange_client,down
bind=NONE,Left,exchange_client,left
bind=NONE,Right,exchange_client,right
bind=NONE,Up,exchange_client,up
bind=NONE,Down,exchange_client,down
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

# ------------------------------------------------------------
# RESIZE mode — resize the focused window
# (previously CTRL+ALT+h/l/j/k)
keymode=resize
binds=NONE,h,resizewin,-50,+0
binds=NONE,l,resizewin,+50,+0
binds=NONE,k,resizewin,+0,-50
binds=NONE,j,resizewin,+0,+50
bind=NONE,Left,resizewin,-50,+0
bind=NONE,Right,resizewin,+50,+0
bind=NONE,Up,resizewin,+0,-50
bind=NONE,Down,resizewin,+0,+50
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

# ------------------------------------------------------------
# MONITOR mode — direction moves focus, Shift+direction moves window
# (previously SUPER+SHIFT+h/l/j/k focusmon, SUPER+SHIFT+CTRL+h/l/j/k tagmon)
keymode=monitor
binds=NONE,h,focusmon,left
binds=NONE,l,focusmon,right
binds=NONE,k,focusmon,up
binds=NONE,j,focusmon,down
bind=NONE,Left,focusmon,left
bind=NONE,Right,focusmon,right
bind=NONE,Up,focusmon,up
bind=NONE,Down,focusmon,down
binds=SHIFT,h,tagmon,left
binds=SHIFT,l,tagmon,right
binds=SHIFT,k,tagmon,up
binds=SHIFT,j,tagmon,down
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

# ------------------------------------------------------------
# TAG mode — tag / workspace operations
# Enter with SUPER+t, then an action letter and a number 1-9:
#   a + <n>   assign the focused window to tag n
#   t + <n>   toggle the focused window on tag n
#   g + <n>   go to workspace n
#   s + <n>   toggle the workspace n view
#   1..9      go to workspace n (shortcut)
#   h / l     switch to previous / next tag
keymode=tag
binds=NONE,a,setkeymode,tag_assign
binds=NONE,t,setkeymode,tag_toggle
binds=NONE,g,setkeymode,tag_go
binds=NONE,s,setkeymode,tag_show
binds=NONE,1,view,1,0
binds=NONE,2,view,2,0
binds=NONE,3,view,3,0
binds=NONE,4,view,4,0
binds=NONE,5,view,5,0
binds=NONE,6,view,6,0
binds=NONE,7,view,7,0
binds=NONE,8,view,8,0
binds=NONE,9,view,9,0
binds=NONE,h,viewtoleft,0
binds=NONE,l,viewtoright,0
bind=NONE,Left,viewtoleft,0
bind=NONE,Right,viewtoright,0
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

# tag mode: assign focused window to tag n
keymode=tag_assign
binds=NONE,1,tag,1,0
binds=NONE,2,tag,2,0
binds=NONE,3,tag,3,0
binds=NONE,4,tag,4,0
binds=NONE,5,tag,5,0
binds=NONE,6,tag,6,0
binds=NONE,7,tag,7,0
binds=NONE,8,tag,8,0
binds=NONE,9,tag,9,0
binds=NONE,a,setkeymode,tag_assign
binds=NONE,t,setkeymode,tag_toggle
binds=NONE,g,setkeymode,tag_go
binds=NONE,s,setkeymode,tag_show
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

# tag mode: toggle focused window on tag n
keymode=tag_toggle
binds=NONE,1,toggletag,1
binds=NONE,2,toggletag,2
binds=NONE,3,toggletag,3
binds=NONE,4,toggletag,4
