# ------------------------------------------------------------
# NAMETAG mode — named-tag / workspace operations
#
# Mirrors TAG mode (SUPER+t) but for named tags. Enter with
# SUPER+e, then a single action key opens fuzzel to pick a name:
#   a   assign the focused window to a named tag
#   t   toggle the focused window on a named tag
#   g   go to a named tag
#   s   toggle the view of a named tag
#   h/l switch to previous / next named tag
#   n   define a new named tag
#   r   rename a named tag
#   d   delete a named tag
#
# Named tags live in the real tag slots 10-31; tags 1-9 are untouched.
# Escape returns to the default mode.

keymode=nametag
binds=NONE,a,spawn_shell,~/.config/mango/scripts/nametag.sh assign
binds=NONE,t,spawn_shell,~/.config/mango/scripts/nametag.sh toggle
binds=NONE,g,spawn_shell,~/.config/mango/scripts/nametag.sh go
binds=NONE,s,spawn_shell,~/.config/mango/scripts/nametag.sh show
binds=NONE,n,spawn_shell,~/.config/mango/scripts/nametag.sh define
binds=NONE,r,spawn_shell,~/.config/mango/scripts/nametag.sh rename
binds=NONE,d,spawn_shell,~/.config/mango/scripts/nametag.sh delete
binds=NONE,h,spawn_shell,~/.config/mango/scripts/nametag.sh prev
binds=NONE,l,spawn_shell,~/.config/mango/scripts/nametag.sh next
bind=NONE,Left,spawn_shell,~/.config/mango/scripts/nametag.sh prev
bind=NONE,Right,spawn_shell,~/.config/mango/scripts/nametag.sh next
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf
