# Catch-all binds for modal modes (keysym matching via binds=).
# Any key not used by a mode returns to the default mode.
# Keys excluded here are valid in some mode, so never listed:
#   h l j k  a t g s  1-9  Left Right Up Down Escape  Print

binds=NONE,space,setkeymode,default
binds=NONE,Tab,setkeymode,default
binds=NONE,Return,setkeymode,default
binds=NONE,BackSpace,setkeymode,default

