# ------------------------------------------------------------
# TAG mode — tag / workspace operations
# Enter with SUPER+t, then an action letter and a number 1-9:
#   a + <n>   assign the focused window to tag n
#   t + <n>   toggle the focused window on tag n
#   g + <n>   go to workspace n
#   s + <n>   toggle the workspace n view
#   1..9      go to workspace n (shortcut)
#   h / l     switch to previous / next tag

keymode=tag
binds=NONE,a,setkeymode,tag_assign
binds=NONE,t,setkeymode,tag_toggle
binds=NONE,g,setkeymode,tag_go
binds=NONE,s,setkeymode,tag_show
binds=NONE,1,view,1,0
binds=NONE,2,view,2,0
binds=NONE,3,view,3,0
binds=NONE,4,view,4,0
binds=NONE,5,view,5,0
binds=NONE,6,view,6,0
binds=NONE,7,view,7,0
binds=NONE,8,view,8,0
binds=NONE,9,view,9,0
binds=NONE,h,viewtoleft,0
binds=NONE,l,viewtoright,0
bind=NONE,Left,viewtoleft,0
bind=NONE,Right,viewtoright,0
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

