# ------------------------------------------------------------
# MONITOR mode — direction moves focus, Shift+direction moves window
# (previously SUPER+SHIFT+h/l/j/k focusmon, SUPER+SHIFT+CTRL+h/l/j/k tagmon)
keymode=monitor
binds=NONE,h,focusmon,left
binds=NONE,l,focusmon,right
binds=NONE,k,focusmon,up
binds=NONE,j,focusmon,down
bind=NONE,Left,focusmon,left
bind=NONE,Right,focusmon,right
bind=NONE,Up,focusmon,up
bind=NONE,Down,focusmon,down
binds=SHIFT,h,tagmon,left
binds=SHIFT,l,tagmon,right
binds=SHIFT,k,tagmon,up
binds=SHIFT,j,tagmon,down
bind=NONE,Escape,setkeymode,default
source=./modal_invalid.conf

